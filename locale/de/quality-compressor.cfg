[mod-name]
quality-compressor=Qualitäts-Verdichter

[mod-description]
quality-compressor=Verdichtet gleiche Rohstoffe niedriger Qualität zu einem Item der nächsten Qualitätsstufe. Planbare Alternative zur Recycler-Schleife.

[entity-name]
quality-compressor=Verdichter
high-pressure-quality-compressor=Hochdruckverdichter

[entity-description]
quality-compressor=Verdichtet Rohstoffe bis zur Qualität „Selten“.\nStrom: __1__ MW Grundverbrauch, je nach Zielstufe bis __2__ MW (siehe Rezept).
high-pressure-quality-compressor=Verdichtet Rohstoffe bis zur Qualität „Legendär“.\nStrom: __1__ MW Grundverbrauch, je nach Zielstufe bis __2__ MW (siehe Rezept).

[recipe-name]
quality-compression=__1__ verdichten (__2__)

[recipe-description]
quality-compression=Strombedarf: [font=default-semibold]__1__ MW[/font] (Maschine normaler Qualität, bessere Qualität spart Strom)\nVerhältnis: __2__ : 1\nDauer: __3__ s bei Geschwindigkeit 1\nMit Qualitätsmodulen höchstens „__4__“
quality-compression-organic=Verbraucht Nährstoffe statt Strom (längere Dauer = mehr Nährstoffe)\nVerhältnis: __1__ : 1\nDauer: __2__ s bei Geschwindigkeit 1\nMit Qualitätsmodulen höchstens „__3__“

[item-name]
quality-compressor=Verdichter
high-pressure-quality-compressor=Hochdruckverdichter

[technology-name]
quality-compression=Qualitätsverdichtung
quality-compression-tier-rare=Verdichtung: Selten
high-pressure-quality-compressor=Hochdruckverdichtung
quality-compression-tier-legendary=Verdichtung: Legendär
quality-compression-material=Verdichtung: __1__

[technology-description]
quality-compression=Der Verdichter macht aus gleichen Rohstoffen ein Item der nächsten Qualitätsstufe. Planbar, ohne Zufall, aber mit hohem Stromverbrauch.
quality-compression-tier-rare=Rohstoffe können bis zur Qualität „Selten“ verdichtet werden.
high-pressure-quality-compressor=Der Hochdruckverdichter verdichtet bis zur Qualität „Legendär“. Schaltet die Zielstufe „Episch“ frei.
quality-compression-tier-legendary=Rohstoffe können bis zur Qualität „Legendär“ verdichtet werden.
quality-compression-material=__1__ kann verdichtet werden, bis zu jeder bereits erforschten Zielstufe.

[quality-compression-effect]
tier=Verdichtung zur Qualität „__1__“
material=__1__ verdichten

[mod-setting-name]
quality-compressor-power-percent=Stromverbrauch der Verdichter (%)
quality-compressor-ratio=Verhältnis: __1__
quality-compressor-ratio-factor=Verhältnis-Faktor: __1__

[mod-setting-description]
quality-compressor-power-percent=Wie viel Strom Verdichter und Hochdruckverdichter brauchen, in Prozent. Je kleiner der Wert, desto weniger Strom.\n\n100 % = Standard: 5 / 20 / 80 / 300 MW (Ungewöhnlich / Selten / Episch / Legendär).\n50 % = 2,5 / 10 / 40 / 150 MW.\n10 % = 0,5 / 2 / 8 / 30 MW.\nErlaubt: 1 bis 100.\n\nPlastik in der Biokammer braucht Nährstoffe statt Strom und ist nicht betroffen.
quality-compressor-ratio=Wie viele Items der Vorstufe zu 1 Item dieser Stufe verdichtet werden.\n\nStandard: __1__\nErlaubt: 2 bis 1000.\n\nDer Verhältnis-Faktor des Rohstoffs kommt noch dazu.
quality-compressor-ratio-factor=Multipliziert das Verhältnis aller Zielstufen für diesen Rohstoff. Wird aufgerundet, mindestens 2.\n\nBeispiel: Faktor 2 bei Verhältnis 12 : 1 → 24 : 1.\n\nStandard: __1__\nErlaubt: 0,1 bis 100.
