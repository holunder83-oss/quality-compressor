[technology-description]
quality-compression=The compressor turns identical raw materials into one item of the next quality tier. Predictable and without randomness, but power hungry.
quality-compression-tier-rare=Raw materials can be compressed up to Rare quality.
high-pressure-quality-compressor=The high-pressure compressor compresses up to Legendary quality. Unlocks the Epic target tier.
quality-compression-tier-legendary=Raw materials can be compressed up to Legendary quality.
quality-compression-material=__1__ can be compressed, up to every target tier already researched.

