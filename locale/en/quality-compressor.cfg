[mod-setting-name]
quality-compressor-power-percent=Compressor power usage (%)
quality-compressor-ratio=Ratio: __1__
quality-compressor-ratio-factor=Ratio factor: __1__

[mod-setting-description]
quality-compressor-power-percent=How much power the compressor and the high-pressure compressor use, in percent. The lower the value, the less power.\n\n100 % = default: 5 / 20 / 80 / 300 MW (Uncommon / Rare / Epic / Legendary).\n50 % = 2.5 / 10 / 40 / 150 MW.\n10 % = 0.5 / 2 / 8 / 30 MW.\nAllowed: 1 to 100.\n\nPlastic in the biochamber uses nutrients instead of power and is not affected.
quality-compressor-ratio=How many items of the previous tier are compressed into 1 item of this tier.\n\nDefault: __1__\nAllowed: 2 to 1000.\n\nThe ratio factor of each raw material is applied on top.
quality-compressor-ratio-factor=Multiplies the ratio of every target tier for this raw material. Result is rounded up, at least 2.\n\nExample: factor 2 with ratio 12 : 1 → 24 : 1.\n\nDefault: __1__\nAllowed: 0.1 to 100.
